# =============================================================================
# update.conf — configuration du système de mise à jour AuraOS
# (installé dans /etc/aura/update.conf — lu par scripts/aura-update)
# =============================================================================

# Dépôt GitHub public source des releases
REPO="AuraOS-Project/auraos"

# Canal de mise à jour : stable | beta
CHANNEL="stable"

# Architecture cible
ARCH="x86_64"

# API GitHub (défaut ; miroir possible pour les réseaux contraints)
API_BASE="https://api.github.com"

# Clé publique minisign épinglée (JAMAIS téléchargée depuis GitHub)
MINISIGN_PUBKEY="/etc/aura/update.pub"

# Intervalle de vérification (secondes) — piloté aussi par aura-update.timer
CHECK_INTERVAL=21600   # 6 h

# Bande passante max en octets/s (0 = illimité)
MAX_BANDWIDTH=0

# Redémarrage automatique après application (false = l'utilisateur décide)
AUTO_REBOOT=false
