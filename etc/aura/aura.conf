# =============================================================================
# aura.conf — configuration système de référence d'AuraOS
# (installé dans /etc/aura/aura.conf)
# =============================================================================

[system]
# Nom de la distribution et identifiant de session Gaming
distro_name      = AuraOS
session_gaming   = aura-shell
session_desktop  = xfce

[performance]
# Profil actif : auto (déterminé par aura-perf-detect) | merguez | mid | high
profile          = auto
# Ré-application automatique du profil à chaque boot (via aura-perf-detect.service)
apply_on_boot    = true
# Plancher FPS contractuel sur les machines modestes
fps_floor_merguez = 30
# Désactiver le bridage FPS sur high-end
fps_cap_high      = 0

[zram]
# Pourcentage de la RAM physique alloué en zRAM par profil
size_pct_merguez  = 50
size_pct_mid      = 25
size_pct_high     = 12
algorithm         = lz4

[ui]
theme            = aura-dark
animations       = auto
blur             = auto
font_scale       = 100
controller_rumble = true

[games]
# Dossier racine des bibliothèques de jeux
library_root     = /var/lib/aura/games
# Préfixes Wine/Proton sandboxés par jeu
prefix_root      = /var/lib/aura/prefixes
# Proton par défaut pour les .exe non Steam
default_proton   = proton-ge
# Résolution interne dynamique par profil
res_scale_merguez = dynamic:0.50-1.00
res_scale_mid     = dynamic:0.75-1.00
res_scale_high    = native

[desktop]
# Bascule instantanée Gaming ↔ Bureau
fast_switch      = true
browser          = librewolf
