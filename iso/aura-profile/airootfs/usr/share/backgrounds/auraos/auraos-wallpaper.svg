<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a33"/>
      <stop offset="1" stop-color="#2a1a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c63ff"/>
      <stop offset="1" stop-color="#c86bff"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1440" cy="280" r="640" fill="url(#glow)"/>
  <circle cx="470" cy="880" r="540" fill="url(#glow)" opacity="0.6"/>

  <text x="960" y="520" text-anchor="middle"
        font-family="DejaVu Sans, Cantarell, sans-serif" font-size="150"
        font-weight="bold" fill="#f5f6ff" letter-spacing="14">AuraOS</text>
  <rect x="700" y="560" width="520" height="6" rx="3" fill="url(#accent)"/>
  <text x="960" y="645" text-anchor="middle"
        font-family="DejaVu Sans, Cantarell, sans-serif" font-size="42"
        fill="#b9bce0" letter-spacing="6">Prototype Live 0.1</text>
  <text x="960" y="1000" text-anchor="middle"
        font-family="DejaVu Sans, Cantarell, sans-serif" font-size="28"
        fill="#8a8fb8" letter-spacing="2">Arch Linux + XFCE — démonstration, sans installeur</text>
</svg>
